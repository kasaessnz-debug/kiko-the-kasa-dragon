[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/book"
  to = "/book.html"
  status = 301

[[redirects]]
  from = "/bookings"
  to = "/book.html"
  status = 301

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 301

[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/hq"
  to = "/admin.html"
  status = 301

# keep the page source out of the public site
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true
