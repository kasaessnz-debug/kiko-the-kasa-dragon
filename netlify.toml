[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/config.js"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/admin.webmanifest"
  [headers.values]
    X-Robots-Tag = "noindex"

# keep the page source out of the public site
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

# keep the project notes out of the public site
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# One address per page: the clean form (/book). Canonicals, sitemap, og:url, schema, llms.txt and links all use it.
# force = true is required, or Netlify serves the .html file with a 200 instead of redirecting.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

